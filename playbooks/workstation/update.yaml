- name: "Install Packages and Perform System Updates"
  hosts: localhost
  become: true
  become_method: "sudo"
  tasks:
    - name: "Update system packages"
      ansible.builtin.apt:
        update_cache: true
        upgrade: true

    - name: "Install wanted packages"
      ansible.builtin.apt:
        state: present
        pkg:
          # Media
          - mpv
          - foliate
          - steam-installer
          - quassel-client
          # Tools
          - gnupg2
          - graphviz
          - zoxide
          - nextcloud-desktop
          - kamoso
          - remmina
          - mangohud
          - openvpn
          - kaddressbook
          - alloy
          - snapd
          - fd-find
          - ca-certificates
          - curl
          - fzf
          - eza
          - bat
          - pass
          - age
          - restic
          - filezilla
          - btop
          - make
          - git
          - foot
          - htop
          - pavucontrol
          - ripgrep
          - wine
          - winetricks
          - bash-completion
          - ansible
          - unzip
          - stow
          - s3fs
          - s3cmd
          - keepassxc
          # Development dependencies and libraries
          - clang
          - python3-pip
          - python3-venv
          - openjdk-25-jdk-headless
          - ruby
          - php8.3-cli
          - composer
          - luarocks
          - gcc
          - libtree-sitter-dev
          # Japanese kana input dependencies
          - fcitx5
          - fcitx5-mozc

    - name: "Remove unwanted system packages"
      ansible.builtin.apt:
        state: absent
        pkg:
          - cowsay
          - akregator
          - kontact
          - entr
          - lutris

    - name: "Remove dependencies that are no longer required"
      ansible.builtin.apt:
        autoremove: true
        purge: true

    - name: Add Flathub Repository
      community.general.flatpak_remote:
        name: flathub
        state: present
        flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
        method: user

    - name: "Install wanted flatpaks"
      community.general.flatpak:
        state: present
        name:
          - com.github.tchx84.Flatseal
          - com.obsproject.Studio
          - md.obsidian.Obsidian
          - net.ankiweb.Anki
          - org.qbittorrent.qBittorrent
          - org.signal.Signal
          - org.torproject.torbrowser-launcher
          - us.zoom.Zoom
          - com.calibre_ebook.calibre
          - net.pcsx2.PCSX2
          - com.bitwarden.desktop
          - org.fedoraproject.MediaWriter
          - org.kde.krename
          - com.usebruno.Bruno
          - com.felipekinoshita.Kana

    - name: "Remove unwanted flatpaks"
      community.general.flatpak:
        state: absent
        name:
          - org.gnome.Contacts
          - org.squidowl.halloy
          - org.nicotine_plus.Nicotine
          - io.gitlab.news_flash.NewsFlash
          - rest.insomnia.Insomnia

    - name: "Install wanted snap packages"
      community.general.snap:
        classic: false
        state: present
        name: []

    - name: "Install wanted classic snap packages"
      community.general.snap:
        classic: true
        state: present
        name:
          - ghostty
          - microk8s
          - julia
          - newsflash
          - nvim
          - helm

    - name: "Remove unwanted snap packages"
      community.general.snap:
        classic: true
        state: absent
        name: []
